syntax = "proto3";

package eCAL.pb;

// Direction of a traced topic.
enum TraceTopicDirection
{
  TRACE_TOPIC_DIRECTION_UNSPECIFIED = 0;
  TRACE_TOPIC_DIRECTION_PUBLISHER   = 1;
  TRACE_TOPIC_DIRECTION_SUBSCRIBER  = 2;
}

// Kind of traced operation.
enum TraceOperationType
{
  TRACE_OPERATION_TYPE_UNSPECIFIED         = 0;
  TRACE_OPERATION_TYPE_SEND                = 1;
  TRACE_OPERATION_TYPE_RECEIVE             = 2;
  TRACE_OPERATION_TYPE_CALLBACK_EXECUTION  = 3;
}

// Transport layer bit flags (compatible to eTracingLayerType).
enum TraceLayerType
{
  TRACE_LAYER_TYPE_NONE = 0;
  TRACE_LAYER_TYPE_SHM  = 1;
  TRACE_LAYER_TYPE_UDP  = 2;
  TRACE_LAYER_TYPE_TCP  = 4;
}

// Metadata captured when a topic is created.
message TraceTopicMetadata
{
  string tracing_version     = 1;
  uint64 entity_id           = 2;
  int32 process_id           = 3;
  string host_name           = 4;
  string topic_name          = 5;
  string encoding            = 6;
  string type_name           = 7;
  TraceTopicDirection direction = 8;
}

// Span emitted by publisher-side tracing.
message PublisherTraceSpan
{
  TraceOperationType op_type = 1;
  uint64 entity_id           = 2;
  uint64 process_id          = 3;
  uint64 payload_size        = 4;
  sint64 clock               = 5;
  uint64 layer               = 6;
  sint64 start_ns            = 7;
  sint64 end_ns              = 8;
}

// Span emitted by subscriber-side tracing.
message SubscriberTraceSpan
{
  TraceOperationType op_type = 1;
  uint64 entity_id           = 2;
  uint64 topic_id            = 3;
  uint64 process_id          = 4;
  uint64 payload_size        = 5;
  sint64 clock               = 6;
  uint64 layer               = 7;
  sint64 start_ns            = 8;
  sint64 end_ns              = 9;
}

// A single appendable trace record. Write length-delimited messages of this
// type sequentially to build a binary trace stream.
message TraceRecord
{
  oneof record
  {
    TraceTopicMetadata metadata   = 1;
    PublisherTraceSpan publisher  = 2;
    SubscriberTraceSpan subscriber = 3;
  }
}

// A complete trace dump in one protobuf message.
//
// This is convenient for non-streaming workflows (single-shot write / read).
message TraceRecordList
{
  repeated TraceRecord records = 1;
}
